<style>
  /* Màu brand VC (giống trang đặt bàn) */
  :root{ --cream:#ebe8dd; --cream-2:#f4f2ea; --red:#ae2720; --red-dk:#8c1f1a; --ink:#231f20; --muted:#7a7268; --bar:76px }
  *{box-sizing:border-box;margin:0;padding:0}
  html{background:var(--ink)}
  body{font-family:'Josefin Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:var(--ink);
       -webkit-font-smoothing:antialiased;min-height:100vh;
       padding-bottom:calc(var(--bar) + env(safe-area-inset-bottom))}
  /* Đầu trang: nền chấm halftone + logo chữ */
  header{background-color:var(--cream);background-image:radial-gradient(var(--ink) 1.3px,transparent 1.6px);background-size:9px 9px;
         border-bottom:2px solid var(--ink);padding:22px 16px 0;text-align:center}
  .plate{display:inline-block;background:var(--cream);padding:14px 22px 12px;border:1.5px solid var(--ink);box-shadow:5px 5px 0 var(--red)}
  .plate svg{display:block;width:150px;height:auto;fill:var(--ink)}
  .tag{display:inline-block;font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:14px;color:var(--red);margin-top:12px;background:var(--cream);padding:2px 10px}
  .addr{display:inline-block;margin:6px 0 16px;background:var(--cream);padding:4px 10px;font-size:12.5px;letter-spacing:.04em;color:var(--ink)}
  /* 2 tab: MENU / PROMOTION */
  nav{display:grid;grid-template-columns:1fr 1fr;max-width:720px;margin:0 auto;gap:0}
  nav a{display:block;text-decoration:none;color:var(--ink);background:var(--cream);border:2px solid var(--ink);border-bottom:0;
        padding:11px 8px 9px;text-align:center;-webkit-tap-highlight-color:transparent}
  nav a + a{border-left:0}
  nav a b{display:block;font-weight:700;font-size:15px;letter-spacing:.22em;padding-left:.22em}
  nav a small{display:block;font-size:11.5px;color:var(--muted);margin-top:3px;letter-spacing:.03em}
  nav a.on{background:var(--ink);color:var(--cream)}
  nav a.on small{color:#cfc9b8}
  /* Cột ảnh: rộng tối đa 720px */
  main{max-width:720px;margin:0 auto;background:var(--cream)}
  .pane{display:none}
  .pane.on{display:block}
  .pane img{display:block;width:100%;height:auto;background:var(--cream-2)}
  .pane img + img{border-top:1px solid #d9d4c6}
  .note{padding:18px 16px 22px;text-align:center;font-size:12.5px;color:var(--muted);background:var(--cream)}
  /* Nút ĐẶT BÀN cố định cuối màn hình */
  .book{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--ink);
        padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .book a{display:block;max-width:688px;margin:0 auto;background:var(--red);color:var(--cream);text-decoration:none;text-align:center;
          padding:10px 8px 8px;border:1.5px solid var(--cream);box-shadow:4px 4px 0 var(--red-dk)}
  .book a:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--red-dk)}
  .book b{display:block;font-weight:700;font-size:16px;letter-spacing:.24em;padding-left:.24em}
  .book small{display:block;font-size:11.5px;letter-spacing:.06em;opacity:.85;margin-top:2px}
</style>

<script>
  // Mặc định mở tab MENU. Link .../menu/#promo mở thẳng tab PROMOTION (dùng cho bài đăng, QR khuyến mãi).
  (function () {
    function mo() {
      var promo = location.hash === '#promo';
      document.getElementById('pMenu').classList.toggle('on', !promo);
      document.getElementById('pPromo').classList.toggle('on', promo);
      document.getElementById('tMenu').classList.toggle('on', !promo);
      document.getElementById('tPromo').classList.toggle('on', promo);
    }
    window.addEventListener('hashchange', function () { mo(); window.scrollTo(0, 0); });
    mo();
  })();
</script>
